experiment_name: vanilla_vit_tiny_imagenet
seed: 42
device: auto

data:
  dataset: tiny_imagenet
  root: data
  image_size: 64
  num_classes: 200
  train_limit:
  test_limit:

model:
  name: vanilla_vit
  patch_size: 8
  embed_dim: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0
  dropout: 0.0

training:
  epochs: 100
  batch_size: 256
  num_workers: 2
  lr: 0.0005
  weight_decay: 0.05
