experiment_name: mae_pretrain_tiny_imagenet
seed: 42
device: auto

data:
  dataset: tiny_imagenet
  root: data
  image_size: 64
  num_classes: 200
  train_limit:
  test_limit:

model:
  name: mae_vit
  patch_size: 8
  embed_dim: 384
  depth: 12
  num_heads: 6
  decoder_embed_dim: 192
  decoder_depth: 4
  decoder_num_heads: 3
  mlp_ratio: 4.0
  mask_ratio: 0.6

training:
  epochs: 200
  batch_size: 512
  num_workers: 2
  lr: 0.0005
  weight_decay: 0.05
  warmup_epochs: 20
