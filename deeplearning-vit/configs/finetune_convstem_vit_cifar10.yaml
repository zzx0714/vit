experiment_name: finetune_convstem_vit_cifar10
seed: 42
device: auto

data:
  dataset: cifar10
  root: data/cifar-10-python
  download: true
  image_size: 32
  num_classes: 10
  train_limit:
  test_limit:

model:
  name: convstem_vit
  patch_size: 4
  embed_dim: 384
  depth: 12
  num_heads: 6
  mlp_ratio: 4.0
  dropout: 0.0

training:
  epochs: 50
  batch_size: 128
  num_workers: 2
  lr: 0.0003
  weight_decay: 0.05

finetune:
  checkpoint: outputs/mae_pretrain_convstem_tiny_imagenet/best.pt
  freeze_epochs: 10
